[project]
name = "rag-base"
version = "0.1.0"
description = "RAG-система для абитуриентов и студентов ДагГАУ (FastAPI + ChromaDB + Ollama + Streamlit)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.5.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "chromadb==0.6.3",
    "docling>=2.110.0",
    "email-validator>=2.3.0",
    "fastapi==0.115.11",
    "fastembed>=0.7.4",
    "httpx>=0.28.1",
    "langchain==0.3.20",
    "ollama>=0.6.2",
    "pydantic-settings==2.14.1",
    "pyjwt>=2.14.0",
    "python-docx==1.1.2",
    "python-dotenv==1.0.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.14,<1.15",
    "sentence-transformers==3.4.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "streamlit==1.43.2",
    "uvicorn==0.34.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.9",
    "pre-commit>=4",
]

[tool.ruff]
target-version = "py313"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
